<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Teknisi - R17 Repair Portal</title>
    <!-- Firebase SDK (v10.8.0) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase Asli Anda
        const firebaseConfig = {
            apiKey: "AIzaSyCYzKTgPJsftAPgW1uV4t-ConZxLYCm_as",
            authDomain: "r17-repair.firebaseapp.com",
            databaseURL: "https://r17-repair-default-rtdb.firebaseio.com",
            projectId: "r17-repair",
            storageBucket: "r17-repair.firebasestorage.app",
            messagingSenderId: "341565633454",
            appId: "1:341565633454:web:b2c36bb28eb0c344e28e3f",
            measurementId: "G-5YHMSY98K7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.addEventListener('DOMContentLoaded', () => {
            const loginEmailForm = document.getElementById('login-email-form');
            const googleLoginBtn = document.getElementById('google-login-btn');
            const alertBox = document.getElementById('alert-box');

            // 1. Login menggunakan Google Popup
            googleLoginBtn?.addEventListener('click', async () => {
                try {
                    await signInWithPopup(auth, provider);
                    showAlert("Login Google Berhasil! Mengalihkan...", "success");
                    setTimeout(() => {
                        window.location.href = 'https://app.r17repair.my.id';
                    }, 1500);
                } catch (error) {
                    console.error("Google Login Error:", error);
                    showAlert("Gagal Login Google: " + error.message, "error");
                }
            });

            // 2. Login menggunakan Email & Password
            loginEmailForm?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    showAlert("Login Berhasil! Mengalihkan...", "success");
                    setTimeout(() => {
                        window.location.href = 'https://app.r17repair.my.id';
                    }, 1500);
                } catch (error) {
                    console.error("Email Login Error:", error);
                    showAlert("Login Gagal: Periksa kembali email dan sandi Anda.", "error");
                }
            });

            function showAlert(message, type) {
                alertBox.style.display = 'block';
                if (type === 'success') {
                    alertBox.style.background = '#d1fae5';
                    alertBox.style.color = '#065f46';
                } else {
                    alertBox.style.background = '#fee2e2';
                    alertBox.style.color = '#991b1b';
                }
                alertBox.textContent = message;
            }
        });
    </script>
    <style>
        :root {
            --primary-navy: #002b66;      
            --sky-blue: #0099ff;          
            --gradient-brand: linear-gradient(135deg, #002b66 0%, #0066cc 50%, #0099ff 100%);
            --bg-light: #f4f7fa;           
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-light); color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: var(--card-bg); width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .login-card h2 { color: var(--primary-navy); font-size: 20px; font-weight: 800; margin-bottom: 6px; text-align: center; }
        .login-card p { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--primary-navy); margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; outline: none; }
        .form-group input:focus { border-color: var(--sky-blue); }
        .btn-submit { width: 100%; background: var(--sky-blue); color: #ffffff; border: none; padding: 12px; border-radius: 6px; font-size: 13px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
        .btn-submit:hover { background: #0077cc; }
        .btn-google { width: 100%; background: #ffffff; color: #334155; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; transition: background 0.2s; }
        .btn-google:hover { background: #f8fafc; }
        .divider { text-align: center; font-size: 11px; color: var(--text-muted); margin: 15px 0; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--border-color); }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        #alert-box { display: none; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; text-align: center; font-weight: 600; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
        .auth-footer a { color: var(--sky-blue); font-weight: 700; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login Teknisi R17</h2>
        <p>Akses Portal Skematik &amp; Database Vercel</p>

        <div id="alert-box"></div>

        <!-- Tombol Login Google Cepat -->
        <button id="google-login-btn" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.31 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.19C.43 8.13 0 9.87 0 11.7s.43 3.57 1.19 5.1l4.08-2.56z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.18 2.69 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
            Login dengan Google
        </button>

        <div class="divider">ATAU EMAIL</div>

        <!-- Form Login Email & Password -->
        <form id="login-email-form">
            <div class="form-group">
                <label>Alamat Email</label>
                <input type="email" id="email" placeholder="email@domain.com" required>
            </div>
            <div class="form-group">
                <label>Kata Sandi (Password)</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="submit" class="btn-submit">Masuk ke Portal</button>
        </form>

        <div class="auth-footer">
            Belum punya akun teknisi? <a href="register.html">Daftar di sini</a>
        </div>
    </div>

</body>
</html>
